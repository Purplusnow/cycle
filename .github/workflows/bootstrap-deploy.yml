# 첫 배포용 — 로컬에서 구운 산출물을 그대로 올린다.
#
# 본 워크플로(publish.yml)의 첫 실행은 캐시가 없어 24년치를 처음부터 받는다.
# 그동안 사이트가 비어 있으면 도메인이 404 를 낸다. 이 워크플로는 미리 구워
# `bootstrap-site` 브랜치에 올려 둔 dist 를 그대로 Pages 에 배포해 그 공백을
# 메운다.
#
# **본 워크플로가 끝나면 그쪽 산출물이 덮어쓴다.** 그때 이 파일과
# bootstrap-site 브랜치를 지우면 된다 — 남겨 두면 손으로 실행했을 때 낡은
# 산출물이 최신 배포를 덮어쓸 수 있다.
name: 첫 배포 (임시)

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# **본 워크플로와 다른 그룹을 쓴다.** 같은 `pages` 그룹에 넣었더니 첫 실행이
# 끝날 때까지 대기 상태로 묶여 버렸다 — 그 공백을 메우려고 만든 워크플로가
# 정확히 그 공백만큼 기다린 셈이다.
#
# 둘이 겹쳐 배포될 여지는 남지만, github-pages 환경이 배포를 직렬화하고 나중
# 것이 남는다. 나중 것은 본 워크플로의 산출물이므로 그게 맞는 결과다.
concurrency:
  group: pages-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
