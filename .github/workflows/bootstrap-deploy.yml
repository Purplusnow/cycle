# 첫 배포용 — 로컬에서 구운 산출물을 그대로 올린다.
#
# 본 워크플로(publish.yml)의 첫 실행은 캐시가 없어 24년치를 처음부터 받는다.
# 그동안 사이트가 비어 있으면 도메인이 404 를 낸다. 이 워크플로는 미리 구워
# `bootstrap-site` 브랜치에 올려 둔 dist 를 그대로 Pages 에 배포해 그 공백을
# 메운다.
#
# **본 워크플로가 끝나면 그쪽 산출물이 덮어쓴다.** 그때 이 파일과
# bootstrap-site 브랜치를 지우면 된다 — 남겨 두면 손으로 실행했을 때 낡은
# 산출물이 최신 배포를 덮어쓸 수 있다.
name: 첫 배포 (임시)

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# 본 워크플로와 같은 그룹을 쓴다. 둘이 동시에 Pages 에 배포하면 어느 쪽이
# 남는지 알 수 없게 된다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
