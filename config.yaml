# 사이트 설정.
site:
  name: "경륜 분석"
  tagline: "광명 경륜 · 승률 예측과 적중률 검증"
  # 절대 URL. canonical 과 dist/CNAME 이 여기서 나온다.
  #
  # github.io 주소를 넣으면 CNAME 파일을 굽지 않는다 — 적어 두면 Pages 가 자기
  # 자신을 커스텀 도메인으로 잡아 무한 리다이렉트에 빠진다. 프로젝트 페이지로
  # 임시 배포할 때를 위한 안전장치다(그때는 base_path 를 "/cycle" 로 둔다).
  url: "https://cycle.koreanblog.xyz"
  # **배포 기준 경로.** 커스텀 도메인은 루트에 놓이므로 비워 둔다.
  base_path: ""
  locale: "ko_KR"
  description: "광명 경륜 출주표와 선수 전법·득점·최근 성적을 머신러닝 모델로 학습해 경주별 승률을 산출합니다. 예상은 발주 전에 확정 저장하며, 실제 결과·배당과 대조한 적중률과 회수율을 공개합니다."

# 검색엔진 소유 확인. 각 콘솔이 주는 content 값만 넣으면 된다.
# 비어 있으면 태그 자체가 나가지 않는다.
verification:
  google: ""   # 서치콘솔 → HTML 태그 방식
  naver: ""    # 서치어드바이저

# 구글 애널리틱스. 비우면 스크립트 자체가 나가지 않는다.
#
# **만드는 사람의 접속은 세지 않는다.** 개발 중에는 자기 방문이 전체의 대부분을
# 차지해 숫자가 통계가 아니라 자기 그림자가 된다. IP 필터는 주소가 바뀌면 새므로
# 브라우저에 표식을 남긴다 — 기기마다 한 번씩 아래로 들어오면 그 뒤로는 계속
# 빠지고, 표식이 있으면 gtag 스크립트를 아예 싣지 않아 요청도 나가지 않는다.
#
#   https://cycle.koreanblog.xyz/?noga=1   집계에서 뺀다
#   https://cycle.koreanblog.xyz/?noga=0   되돌린다
analytics:
  ga4_id: "G-M17FCQ9GN8"

# 애드센스. client 가 비어 있으면 로더 스크립트도, 광고 자리도 나가지 않는다.
#
# 게시자 ID 는 boat·horse 와 같은 계정이다. 이 값만 채우면 로더가 실리고
# `ads.txt` 가 도메인 루트에 구워진다 — **ads.txt 가 없으면 애드센스가
# '승인되지 않은 판매자'로 보고 게재를 막는다.**
#
# slot_* 은 AdSense 콘솔에서 **이 사이트용 광고 단위**를 만들어 받는 번호라
# 콘솔에서만 발급된다. 비워 두면 수동 광고 자리는 렌더링되지 않는다 — 빈 상자가
# 남아 화면만 성기게 되는 것을 막기 위해서다. 로더는 실리므로 콘솔에서
# **자동 광고**를 켜 두었다면 그것만으로 게재된다.
#
# 광고 자리는 **본문을 읽은 뒤**에 둔다 — 첫 화면은 편성 아래, 상세는 예상판을
# 읽은 다음. 라벨을 달아 예상 내용과 섞여 보이지 않게 한다.
#
# **사이트 승인은 따로 받지 않는다.** AdSense 사이트 승인은 도메인 단위이고
# koreanblog.xyz 는 이미 승인된 도메인이라, 서브도메인은 배포 즉시 게재된다.
# 콘솔에서 할 일은 광고 단위 3개를 만들어 아래 번호를 채우는 것뿐이다.
adsense:
  client: "ca-pub-4640178123605595"
  slot_top: "1671424837"          # cycle.koreanblog.xyz_top — 첫 화면 편성 아래
  slot_in_article: "8847403390"   # cycle.koreanblog.xyz_article — 상세 예상판 다음
  slot_bottom: "8045261492"       # cycle.koreanblog.xyz_bottom — 페이지 끝

build:
  # 상세 페이지를 만들 과거 경주 수. 워크포워드 기록이 1만 3천 경주라 전부
  # 구우면 파일이 수만 개가 된다 — 손으로 훑어볼 수 있는 만큼만 만든다.
  past_races: 400
  # 목록에 노출할 다가올 경주 최대 수
  upcoming_limit: 60
  # 결과 아카이브에 실을 경주 수
  results_limit: 300
  # 구간별 집계를 내보낼 최소 표본. 이보다 얕으면 백분율이 잡음이다.
  min_sample: 30
